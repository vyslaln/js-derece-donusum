<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Derece Dönüşüm Uygulaması</title>
</head>
<body>
    <!-- Kullanıcıdan bir derece isteyeceğiz, input alanının hemen altına iki adet buton ekleyeceğiz ve yapılan dönüşümü hem ekrana 
     hemde konsola yazdıracağız. -->

     <!-- Kullanıcının dereceyi gireceği kısım -->
    <input type="number" placeholder="Lütfen derece giriniz.." id="dereceDonusum">

    <br><br>

    <!-- Dönüşüm butonları -->
    <button type="button" id="celciusFahrenhaytBtn">
        C -> F
    </button>

    <button type="button" id="fahrenhaytCelciusBtn">
        F -> C
    </button>

    <br><br>

    <!-- Dönüşüm sonucunun ekrana yazdırılacağı alan -->
    <p id="sonucAlani"></p>

    <!-- Harici Js dosyamız -->
     <script src="derece-donusum.js"></script>
</body>
</html>
